[package]
name = "passage-router"
description = "Passage Router"
authors = [
    "Joshua Dean Küpper <admin@joshua-kuepper.de>",
    "Paul Wagner <contact@paulwagner.dev>",
]
license = "MIT"
readme = "README.md"
keywords = ["minecraft", "opentelemetry", "monitoring", "package"]
categories = ["emulators", "network-programming"]
version.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
passage-core = { workspace = true }
passage-adapters = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "signal"] }
tokio-util = { workspace = true, features = ["rt", "codec"] }
proxy-header = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
cfb8 = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
config = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "time", "io-util"] }
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "rate_limiter"
harness = false
